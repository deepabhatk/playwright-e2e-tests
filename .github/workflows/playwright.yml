name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:


    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      RUNNER: ${{ secrets.RUNNER }}
      TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Set up Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        id: playwright-tests
        run: npm run test:make-apmt
      - name: Generate Allure report
        if: ${{ always() && steps.playwright-tests.outcome != 'skipped' }}
        run: |
          if [ -d allure-results ] && [ -n "$(find allure-results -type f -print -quit)" ]; then
            npx --yes allure-commandline@2.34.1 generate allure-results --clean -o allure-report
          else
            echo "No Allure results were generated; skipping report generation."
          fi
      - name: Upload Allure results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Allure HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
